<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flame Test Trivia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook graph paper; setup bench -> question tile -> round summary, cumulative ledger on top */
:root{
  --paper:#f3f6f8; --grid:#dbe4ea; --ink:#14283a; --muted:#566b7c; --card:#ffffff; --line:#c9d6df;
  --accent:#e8890c;
  --good:#1f8a5b; --good-bg:#e3f4ec; --bad:#c23b3b; --bad-bg:#fbe7e7;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1b27; --grid:#172a3a; --ink:#e4edf3; --muted:#93a8b8; --card:#132433; --line:#24394b;
  --accent:#f5a03a; --good:#4cc68d; --good-bg:#123a2a; --bad:#ee6b6b; --bad-bg:#3d1b1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1b27; --grid:#172a3a; --ink:#e4edf3; --muted:#93a8b8; --card:#132433; --line:#24394b;
  --accent:#f5a03a; --good:#4cc68d; --good-bg:#123a2a; --bad:#ee6b6b; --bad-bg:#3d1b1f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}

h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--card);padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.stat b.acc{color:var(--accent)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.panel h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 14px}

/* setup */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.field input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.levels input{position:absolute;opacity:0;pointer-events:none}
.levels label{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;background:var(--paper)}
.levels label b{font-weight:600}
.levels label small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.levels input:checked+label{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.levels input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:6px;padding:8px 16px;cursor:pointer;background:var(--paper);font-family:var(--mono)}
.seg input:checked+label{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ideas button{font:12.5px var(--body);border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:4px 10px;cursor:pointer}
.ideas button:hover{color:var(--ink);border-color:var(--accent)}
.err{color:var(--bad);font-size:14px;margin:10px 0 0}

/* question */
.progress{display:flex;gap:3px;height:8px;margin-bottom:18px}
.progress span{flex:1;border-radius:2px;background:var(--line)}
.progress span.pend{background:transparent;border:1px dashed var(--line)}
.progress span.good{background:var(--good)} .progress span.bad{background:var(--bad)} .progress span.cur{background:var(--accent)}
.q{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.tile{width:92px;aspect-ratio:1;max-width:100%;border:2px solid var(--ink);border-radius:4px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono)}
.tile .n{font-size:12px;display:flex;justify-content:space-between}
.tile .sym{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--accent);overflow:hidden}
.tile .nm{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbody{min-width:0}
.meta{margin-bottom:6px}
.qtext{font-family:var(--display);font-weight:500;font-size:clamp(20px,4.4vw,25px);line-height:1.25;margin:0 0 18px;text-wrap:balance}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:focus-visible,.btn:focus-visible,.ideas button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice .k{font-family:var(--mono);font-weight:500;width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:13px}
.choice:disabled{cursor:default}
.choice.right{background:var(--good-bg);border-color:var(--good)}
.choice.right .k{background:var(--good);border-color:var(--good);color:var(--card)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.choice.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--card)}
.choice.dim{opacity:.55}
.reveal{margin-top:16px;border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.verdict{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.reveal p{margin:6px 0 0;max-width:62ch}

/* audio questions */
.aud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-6px 0 18px}
.aud .btn{font-family:var(--mono);min-width:118px}
.aud .btn.on{border-color:var(--accent);color:var(--accent)}
.credit{font-size:12px;color:var(--muted);line-height:1.4;min-width:0;flex:1 1 220px}
.credit a{color:inherit}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 0}

.choice.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.duel{font-family:var(--mono);font-size:13px}
.mrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.mrow:hover{border-color:var(--accent)}
.mrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mrow .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .st{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);flex:none}
.mrow .st.turn{color:var(--accent)}
.btn{font:500 14px var(--body);border-radius:6px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1206}
.btn.primary:disabled{opacity:.5;cursor:default}
.btn.quiet{border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:18px}

/* loading */
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;text-align:center}
.flame{width:18px;height:46px;border-radius:50% 50% 40% 40%/70% 70% 30% 30%;background:linear-gradient(to top,var(--accent),#ffd27a);animation:flick .5s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes flick{from{transform:scaleY(.85) skewX(-4deg)}to{transform:scaleY(1.08) skewX(4deg)}}

/* summary */
.big{font-family:var(--display);font-weight:800;font-size:56px;color:var(--accent);line-height:1}
.summary{text-align:center}

/* history */
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.hist .h:first-child{border-top:0}
.hist .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .lv{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hist .sc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.saved{font-family:var(--mono);font-size:11px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

@media (max-width:520px){
  .q{grid-template-columns:1fr}
  .panel{padding:18px}
  .tile{width:72px}.tile .sym{font-size:26px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .levels{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Flame Test <span>Trivia</span></h1>
    <div class="sub">Pick a subject and difficulty · answers revealed after you guess</div>
  </header>

  <section class="stats" aria-label="Cumulative results">
    <div class="stat"><b id="sPts" class="acc">0</b><span class="label">Total points</span></div>
    <div class="stat"><b id="sCor">0/0</b><span class="label">Correct</span></div>
    <div class="stat"><b id="sAcc">—</b><span class="label">Accuracy</span></div>
    <div class="stat"><b id="sRounds">0</b><span class="label">Rounds · best streak <span id="sStreak">0</span></span></div>
  </section>

  <main id="stage"></main>

  <section class="panel" id="histPanel">
    <h2>Past rounds</h2>
    <div class="hist" id="hist"></div>
  </section>

  <div class="foot">
    <span class="saved"><span id="saved">Loading saved results…</span> · v15</span>
    <div id="resetZone"></div>
  </div>
</div>

<script>
/* Calibrated against real labeled trivia (Open Trivia DB easy/medium/hard science sets) and
   Jeopardy! solve rates by row (top row ~96% solved, bottom row ~71%). Bands are the share of
   ordinary adults who'd answer correctly, given four choices. */
/* Anchors mix subjects so non-science rounds are calibrated too. Sources: Open Trivia DB
   labeled sets (science, history) and this player's own results. The "test" line is the
   rule that separates each level from the next. */
const LEVELS={
  easy:{name:"Easy",pts:1,band:[82,100],target:88,
    desc:"About 85-95% of ordinary adults would get it right.",
    test:"The answer is a household name or school-level fact most adults could say without seeing the choices.",
    anchors:["Who was the first President of the United States? (George Washington)","What is the largest planet in the solar system? (Jupiter)","Which organ pumps blood through the body? (heart)","Which ship carried the Pilgrims to America in 1620? (Mayflower)"]},
  medium:{name:"Medium",pts:2,band:[65,85],target:75,
    desc:"About 65-80% of ordinary adults would get it right. A small step up from Easy: still mainstream, famous material, just not the single most famous fact.",
    test:"Most adults have HEARD of the answer and would recognize it among the four choices, even if they couldn't recall it unprompted. If the answer is a name or term most adults have never heard (e.g. Peace of Westphalia, Zheng He, Justinian), it is NOT Medium. No exact years or numbers as the answer.",
    anchors:["Which country gave the Statue of Liberty to the United States? (France)","What disease paralyzed President Franklin D. Roosevelt? (polio)","The 1215 charter that limited King John's power is called what? (Magna Carta)","What is the name of Han Solo's ship in Star Wars? (Millennium Falcon)","Dry ice is the solid form of what? (carbon dioxide)","Which part of the brain coordinates balance? (cerebellum)"]},
  hard:{name:"Hard",pts:3,band:[38,64],fanBand:[45,70],target:55,
    desc:"A real step up from Medium. Measured against fans of the subject: a casual fan gets about half; a dedicated fan gets most.",
    test:"Not the famous main characters, places or headline facts of the subject (those are Easy/Medium even for a niche subject like a film series or a book series). Use secondary characters, specific events, causes, and well-known-to-fans details.",
    anchors:["What is Chewbacca's home planet in Star Wars? (Kashyyyk)","Whose 1919 eclipse observations supported general relativity? (Arthur Eddington)","Which 1648 agreement ended the Thirty Years' War? (Peace of Westphalia)","Which goblin helps Harry, Ron and Hermione break into Gringotts? (Griphook)"],
    tooEasy:["Who is Luke Skywalker's father? (Darth Vader)","What is Harry Potter's owl called? (Hedwig)","Who is headmaster of Hogwarts for most of the series? (Dumbledore)"]},
  expert:{name:"Expert",pts:5,band:[0,40],fanBand:[25,50],target:38,
    desc:"Hard, but winnable. A dedicated fan or someone who studied the subject gets about a third to half right; a casual fan rarely does.",
    test:"Deep knowledge of the subject's own core material: lesser-known characters and events from the books or films themselves, the deeper concepts a serious student learns. Everything must be findable in the main source material or a standard introduction to the field.",
    anchors:["Who taught Care of Magical Creatures before Hagrid? (Silvanus Kettleburn)","What is the ~1.4 solar-mass upper limit for a white dwarf called? (Chandrasekhar limit)","In The Lord of the Rings, what is Aragorn's reforged sword called? (Andúril)","Which English king faced the Peasants' Revolt of 1381? (Richard II)"],
    tooHard:["Who created the sound effects for the original Star Wars? (Ben Burtt)","Which experiment showed space quantization with a beam of silver atoms? (Stern-Gerlach)","What is the exact runtime in minutes of The Empire Strikes Back? (124)"],
    never:"Never ask about behind-the-scenes production credits (animators, sequence directors, lyricists, software, studio technology), exact years or numbers, or one-line background names. Those make a question impossible, not expert."}
};
const IDEAS=["Astronomy","Aviation weather","Chemistry","Human anatomy","Geology","Physics","Computer science","Oceanography"];
const KEY="flame-test-trivia-v2";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- diagnostics: one log doc per page load ---------- */
const T0=Date.now(),LOADID=String(T0)+"-"+Math.random().toString(36).slice(2,6);
let dbAll=null,logs=[],logTimer=null;
function log(ev){
  logs.push((Date.now()-T0)+"ms "+ev); if(logs.length>200)logs.shift();
  clearTimeout(logTimer); logTimer=setTimeout(flushLog,800);
}
function flushLog(){if(dbAll){try{dbAll.doc("debuglog/"+LOADID).set({at:new Date(T0).toISOString(),ua:navigator.userAgent,events:logs.slice()}).catch(()=>{})}catch(e){}}}
window.addEventListener("error",e=>{log("ERROR "+e.message+" @"+(e.lineno||"?"));showErr(e.message)});
window.addEventListener("unhandledrejection",e=>{const r=e.reason;log("REJECT "+(r&&(r.code||r.message)||String(r)))});
document.addEventListener("visibilitychange",()=>log("visibility "+document.visibilityState));
window.addEventListener("pagehide",()=>{log("pagehide");flushLog()});
function showErr(m){const z=$("saved");if(z)z.textContent="Error: "+m}
const blank=()=>({totals:{answered:0,correct:0,points:0,rounds:0,bestStreak:0},streak:0,history:[],round:null,seen:{}});
const AKEY="flame-test-trivia-audio";
let audioPref=(()=>{try{return localStorage.getItem(AKEY)==="1"}catch(e){return false}})();
function setAudioPref(on){audioPref=!!on;form.audio=audioPref;try{localStorage.setItem(AKEY,on?"1":"0")}catch(e){}}
let state=blank(), view="setup", pending=null, form={subject:"",level:"medium",count:10,audio:audioPref};
/* Scores are rebuilt from (a) a fixed baseline doc and (b) one saved record per answered question.
   Records are only ever added, never overwritten, so an old copy of the page open somewhere
   can't erase anything. The round in progress lives in its own doc. */
let records=[], baseline=null, resetAt="", dbReady=false, ansCol=null, curDoc=null, setDoc=null, queue=[];
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.records){records=s.records;baseline=s.baseline||null;resetAt=s.resetAt||"";state.round=s.round||null}}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({records,baseline,resetAt,round:state.round}))}catch(e){}}
function migrate(d){ // older single-doc formats -> baseline
  if(d&&d.totals)return {at:new Date().toISOString(),totals:d.totals,history:d.history||[],seen:d.seen||{}};
  if(d&&d.answers){const v=Object.values(d.answers),c=v.filter(x=>x.correct).length;
    if(v.length)return {at:new Date().toISOString(),totals:{answered:v.length,correct:c,points:c,rounds:1,bestStreak:d.bestStreak||0},
      history:[{subject:"Science (original set)",level:"easy",correct:c,total:v.length,points:c,at:new Date().toISOString()}],seen:{}}}
  return null;
}
function rebuild(){
  const recs=records.filter(r=>!resetAt||r.at>resetAt).sort((a,b)=>a.at<b.at?-1:1);
  const base=baseline&&(!resetAt||baseline.at>resetAt)?baseline:null;
  const t={answered:0,correct:0,points:0,rounds:0,bestStreak:0}, seen={}, rounds={};
  if(base){Object.assign(t,base.totals);Object.entries(base.seen||{}).forEach(([k,v])=>{const kk=subjectKey(k);seen[kk]=(seen[kk]||[]).concat(v)})}
  let run=0;
  recs.forEach(r=>{
    t.answered++; if(r.correct){t.correct++;t.points+=r.pts;run++;t.bestStreak=Math.max(t.bestStreak,run)}else run=0;
    (seen[subjectKey(r.subject)]||(seen[subjectKey(r.subject)]=[])).push(r.line);
    const g=rounds[r.round]||(rounds[r.round]={subject:r.subject,level:r.level,correct:0,total:0,points:0,at:r.at});
    g.total++; if(r.correct){g.correct++;g.points+=r.pts} g.at=r.at;
  });
  const hist=Object.values(rounds); t.rounds+=hist.length;
  state.totals=t; state.streak=run; state.seen=seen;
  state.history=hist.sort((a,b)=>a.at<b.at?1:-1).concat(base?base.history:[]).slice(0,40);
}
/* this player's own hit rate per level, used to calibrate new questions */
function perfFor(level,subject){
  const k=subject?subjectKey(subject):null;
  return records.filter(r=>(!resetAt||r.at>resetAt)&&r.level===level&&(!k||subjectKey(r.subject)===k)).slice(-30);
}
async function initDb(){
  try{
    const api=window.claude;
    if(!api||!api.use){setSaved("Saved in this browser");return}
    const [db,user]=await Promise.all([api.use("db"),api.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){setSaved("Saved in this browser");return}
    dbAll=db; log("db ready"); flushLog();
    const col=db.collection("data/users/"+uid);
    ansCol=db.collection("data/users/"+uid+"/log/answers");
    curDoc=col.doc("current"); setDoc=col.doc("settings");
    const [bSnap,sSnap,cSnap,aSnap]=await Promise.all([col.doc("baseline").get(),setDoc.get(),curDoc.get(),ansCol.limit(1000).get()]);
    if(bSnap.exists)baseline=bSnap.data();
    else{ // first run on this format: fold the old single-doc scores into a baseline once
      const old=await col.doc("trivia").get();
      baseline=old.exists?migrate(old.data()):null;
      if(baseline)await col.doc("baseline").set(baseline);
    }
    resetAt=(sSnap.exists&&sSnap.data().resetAt)||"";
    const remoteRecs=aSnap.docs.map(d=>d.data());
    const ids=new Set(remoteRecs.map(r=>r.id));
    records=remoteRecs.concat(records.filter(r=>!ids.has(r.id)&&queue.some(q=>q.id===r.id)));
    // never resume a saved round on open; clear it so the page always starts on a blank setup screen
    if(cSnap.exists&&cSnap.data().round&&!state.round)curDoc.set({round:null}).catch(()=>{});
    dbReady=true; log("db loaded records="+remoteRecs.length+" baseline="+(baseline?baseline.totals.answered:0));
    flushQueue();
    rebuild(); saveLocal();
    if(view==="setup")renderStats();
    else render();
    setSaved("Results saved to your account");
  }catch(e){log("initDb error "+(e&&(e.code||e.message)));setSaved("Saved in this browser")}
}
async function flushQueue(){
  if(!dbReady)return;
  while(queue.length){const r=queue[0];try{await ansCol.doc(r.id).set(r);queue.shift()}catch(e){setSaved("Couldn't reach your account · will retry");return}}
  setSaved("Results saved to your account");
}
function saveRecord(r){records.push(r);queue.push(r);saveLocal();flushQueue()}
function saveRound(){saveLocal();if(dbReady&&curDoc)curDoc.set({round:state.round?JSON.parse(JSON.stringify(state.round)):null}).catch(()=>{})}

function shuffleQ(q){

function valid(q){

/* Pull every complete {...} object out of streamed text, even before the array closes */

    const ch=text[i];
    if(inStr){ if(esc2)esc2=false; else if(ch==="\\")esc2=true; else if(ch==='"')inStr=false; continue }
    if(ch==='"'){inStr=true;continue}
    if(ch==="{"){if(depth===0)objStart=i;depth++}
    else if(ch==="}"){depth--; if(depth===0&&objStart>=0){try{out.push(JSON.parse(text.slice(objStart,i+1)))}catch(e){out.push(null)}objStart=-1}}

function singular(w){

  if(/(ss|us|is|ics)$/.test(w))return w;

  const miss=recs.filter(r=>!r.correct).slice(-5).map(r=>"  - "+r.line).join("\n");

  return `Calibration from this player's own results at ${L.name} ${scope}: ${pct}% correct over ${recs.length} questions (target ${L.target}%). That was ${dir}.
Recent ones they got right:
${got||"  (none)"}

${miss||"  (none)"}
`;

"a" is the 0-based index of the correct choice in "c".`;

/* ---------- duplicate detection ---------- */
const STOP=new Set("a an the of in on at to for is are was were which what who whom whose how many much does do did by with from as that this these those its it be or and called known name".split(" "));
function words(t){return new Set(String(t).toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)))}
function overlap(a,b){if(!a.size||!b.size)return 0;let n=0;a.forEach(w=>{if(b.has(w))n++});return n/Math.min(a.size,b.size)}
function isDup(q,pool){
  const qa=String(q.c[q.a]).toLowerCase().trim(), qw=words(q.q);
  return pool.some(p=>{
    const m=p.match(/^(.*) → (.*)$/); if(!m)return false;
    const pq=words(m[1]), pa=m[2].toLowerCase().trim();
    const ov=overlap(qw,pq);
    return ov>=0.7 || (pa===qa && ov>=0.34);
  });
}
/* Reject a question whose text already contains its answer. */
function givesAway(q){
  const ans=String(q.c[q.a]).toLowerCase().replace(/^(the|a|an) /,"").replace(/[^a-z0-9 ]/g," ").trim();
  if(ans.length<4)return false;
  const text=" "+String(q.q).toLowerCase().replace(/[^a-z0-9 ]/g," ")+" ";
  if(text.includes(" "+ans+" "))return true;
  // multi-word names: the distinctive last word (e.g. "Ashman" in "Howard Ashman")
  const parts=ans.split(/\s+/); const last=parts[parts.length-1];
  return parts.length>1&&last.length>=5&&text.includes(" "+last+" ")&&!["theorem","effect","number","limit","temperature","experiment","constant"].includes(last);

function seenLine(q){return q.q.replace(/\s+/g," ").slice(0,140)+" → "+String(q.c[q.a]).slice(0,60)}
/* Streams questions into the round as each one finishes. Resolves when Claude is done
   (or when the closing bracket arrives, whichever is first). */
function generate(sample,subject,level,count,onQuestion){
  return new Promise((resolve,reject)=>{
    let seen=0,settled=false,lastText="";
    const finish=()=>{if(!settled){settled=true;resolve(lastText)}};
    const ingest=text=>{
      lastText=text;
      const objs=extractObjects(text);
      for(;seen<objs.length;seen++){const o=objs[seen];const q=o&&prep(o,subject);if(q){q.pct=Number(o.pct);q.fan=Number(o.fan);onQuestion(q)}}
      const n=(text.match(/"q"\s*:/g)||[]).length;
      setProgress(n?`${Math.min(n,count)} of ${count} written`:"Writing…");
      if(/\]\s*(```)?\s*$/.test(text))finish();
    };
    const opts={modelTier:"default",cache:false,signal:abortCtl.signal,
      onText:({text})=>{if(!gotText)log("first text");gotText=true;try{ingest(text)}catch(e){log("INGEST ERROR "+e.message);throw e}}};
    sample(buildPrompt(subject,level,Math.min(count+5,20)),opts)
      .then(r=>{if(r&&r.text)ingest(r.text);finish()})
      .catch(e=>{if(e&&e.text)ingest(e.text);if(!settled){settled=true;reject(e)}});

  saveRecord({id:"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),round:r.id,subject:r.subject,key:subjectKey(r.subject),

  space:/\b(space|spaceflight|space (race|exploration|program|history|travel)|apollo|nasa|moon landings?|the moon|astronauts?|rockets?|sputnik|mars|mars exploration)\b/,
  history:/\b(american history|us history|u ?s history|united states history|20th century|twentieth century|1950s|1960s|cold war|kennedy)\b/,
  ww2:/\b(world war (ii|2|two)|wwii|ww2|second world war|1940s|battle of britain|pearl harbor|warbirds?)\b/,
  owls:/\b(owls?)\b/,
  speeches:/\b(presidents?|presidential|us presidents|speeches|famous speeches|roosevelt|fdr|franklin roosevelt|great depression|new deal)\b/,
  trains:/\b(trains?|railroads?|railways?|locomotives?|steam engines?|union pacific)\b/
};
const AUDIO_SKIP=/\b(weather|meteorolog|search engines?)\b/;
const CLIPS=/*CLIPS*/[];
const CLIP_BY_ID=Object.fromEntries(CLIPS.map(k=>[k.id,k]));
function clipGroupsFor(subject){
  const s=" "+String(subject).toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()+" ";
  if(AUDIO_SKIP.test(s))return [];
  return Object.keys(AUDIO_GROUPS).filter(g=>AUDIO_GROUPS[g].test(s.trim())||AUDIO_GROUPS[g].test(s));
}
function clipsFor(subject){const g=clipGroupsFor(subject);return g.length?CLIPS.filter(k=>k.g.some(x=>g.includes(x))):[]}
const audioCount=count=>Math.round(count/3);
/* positions for n clips spread through a round, never first (so text and audio arrive together) */
function audioSlots(count,n){const out=[];for(let k=0;k<n;k++)out.push(Math.max(1,Math.min(count-1,Math.round((k+.5)*count/n))));return [...new Set(out)]}
function clipQuestion(k){return {q:k.q,c:k.c.slice(),a:0,x:k.x,sym:"♪",cat:k.cat,au:k.id}}
/* pick n clips for this subject: ones the player hasn't had first, mixed across categories */
function pickClips(subject,n){
  const pool=clipsFor(subject); if(!pool.length||n<1)return [];
  const seen=new Set(seenFor(subject)), fresh=[], old=[];
  pool.slice().sort(()=>Math.random()-.5).forEach(k=>(seen.has(seenLine(clipQuestion(k)))?old:fresh).push(k));
  const byCat={}; fresh.forEach(k=>(byCat[k.cat]||(byCat[k.cat]=[])).push(k));
  const mixed=[]; const cats=Object.values(byCat);
  while(cats.some(c=>c.length))cats.forEach(c=>{if(c.length)mixed.push(c.shift())});
  return mixed.concat(old).slice(0,n).map(k=>shuffleQ(clipQuestion(k)));
}
function audioPlan(subject,count){
  if(!form.audio)return {slots:[],clips:[]};
  const clips=pickClips(subject,audioCount(count));
  return {slots:audioSlots(count,clips.length),clips};
}
/* splice planned clips into a finished list of text questions (challenge mode, and any leftovers) */
function mergeClips(qs,plan){
  const out=qs.slice(), clips=plan.clips.slice();
  plan.slots.forEach(i=>{if(clips.length)out.splice(Math.min(i,out.length),0,clips.shift())});
  return out.concat(clips);
}

/* one shared player, outside the DOM, so re-rendering after an answer doesn't cut the clip off */
const player=new Audio(); player.preload="auto";
let loadedClip=null, playingClip=null, audioErr=null; const played={};
function clipCredit(k){return `Audio: <a href="${esc(k.src)}" target="_blank" rel="noopener">${esc(k.title)}</a> · ${esc(k.by)} · ${esc(k.lic)} · Wikimedia Commons`}
function playLabel(id){return audioErr===id?"⚠ Retry":playingClip===id&&!player.paused?"■ Stop":played[id]?"▶ Play again":"▶ Play"}
function audioHTML(q){
  const k=q&&q.au&&CLIP_BY_ID[q.au]; if(!k)return "";
  return `<div class="aud"><button type="button" class="btn${playingClip===k.id&&!player.paused?" on":""}" id="playBtn" data-au="${esc(k.id)}" aria-label="Play the recording">${playLabel(k.id)}</button><div class="credit">${clipCredit(k)}</div></div>`;
}
function syncPlay(){
  const b=$("playBtn"); if(!b)return;
  const id=b.dataset.au; b.textContent=playLabel(id); b.classList.toggle("on",playingClip===id&&!player.paused);
}
function toggleClip(id){
  const k=CLIP_BY_ID[id]; if(!k)return;
  if(playingClip===id&&!player.paused){player.pause();player.currentTime=0;playingClip=null;syncPlay();return}
  audioErr=null;
  if(loadedClip!==id){player.src=k.url;loadedClip=id}else{try{player.currentTime=0}catch(e){}}
  playingClip=id; played[id]=true;
  const pr=player.play();
  if(pr&&pr.catch)pr.catch(e=>{log("audio play failed "+id+" "+(e&&e.name));if(playingClip===id){playingClip=null;audioErr=id;loadedClip=null}syncPlay()});
  syncPlay();
}
["playing","pause","ended"].forEach(ev=>player.addEventListener(ev,()=>{if(ev==="ended")playingClip=null;syncPlay()}));
player.addEventListener("error",()=>{log("audio error "+loadedClip);audioErr=loadedClip;playingClip=null;loadedClip=null;syncPlay()});
/* keep playing only while the question that owns the clip is on screen */
function settleAudio(activeId){
  if(playingClip&&playingClip!==activeId){player.pause();playingClip=null}
  const b=$("playBtn"); if(b)b.onclick=()=>toggleClip(b.dataset.au);
}
function audioHint(){
  const el=$("audioHint"); if(!el)return;

  el.textContent=!form.audio?"Off: every question is text."
    :!sub?"On: about a third of the questions play a short recording when the subject has clips (birds, animals, musical instruments, aircraft, trains, spaceflight, WWII and 20th-century US history)."
    :n?`On: ${Math.min(audioCount(c),n)} of ${c} questions will play a recording.`
    :"On, but there are no recordings for this subject, so this round will be all text.";
}

/* ---------- challenges: two players, turns passed by text message ----------
   Artifact links only carry a plain "#name" (letters, digits, hyphens), so the match is packed
   into that alphabet: base64url with "-" written as "-1" and "_" as "-0". Links point at the
   published artifact, since this page itself runs on a sandbox address.
   No server: the link carries the whole match (questions + both players' answers),
   compressed after "#c=". Each device keeps its own copy and merges every link it opens.
   Turn order ping-pongs: player 0 answers question 1 first, player 1 answers question 2 first,
   and so on, so every text answers the other player's open question and opens a new one.
   A question's result is shown only once both players have answered it. */
const MKEY="flame-test-trivia-matches";
const ART_URL="https://claude.ai/artifact/9eGyA4eYmsvLgTnr6m3rTP";
const toName=t=>t.replace(/-/g,"-1").replace(/_/g,"-0");
const fromName=t=>t.replace(/-([01])/g,(_,d)=>d==="1"?"-":"_");
async function matchLink(m){return ART_URL+"#c"+toName(await packMatch(m))}
let matches=(()=>{try{return JSON.parse(localStorage.getItem(MKEY)||"{}")||{}}catch(e){return {}}})();
let curMatch=null, matchShow=null, matchMsg="";
function saveMatches(){try{localStorage.setItem(MKEY,JSON.stringify(matches))}catch(e){}}
const firstOf=i=>i%2;
const nextIdx=(m,p)=>m.A[p].findIndex(x=>x==null);
const canAnswer=(m,p,i)=>i>=0&&(firstOf(i)===p||m.A[1-p][i]!=null);
const revealed=(m,i)=>m.A[0][i]!=null&&m.A[1][i]!=null;
const complete=m=>m.qs.every((_,i)=>revealed(m,i));
function mScores(m){const s=[0,0];m.qs.forEach((q,i)=>{if(revealed(m,i)){if(m.A[0][i]===q.a)s[0]++;if(m.A[1][i]===q.a)s[1]++}});return s}
function mStatus(m){
  if(complete(m)){const s=mScores(m);return {key:"done",text:`Final · you ${s[m.me]} · them ${s[1-m.me]}`}}
  return canAnswer(m,m.me,nextIdx(m,m.me))?{key:"turn",text:"Your turn"}:{key:"wait",text:"Their turn"};
}
/* answers count toward your scores only once revealed, so totals can't give away a result early */
function recordRevealed(m){
  m.rec=m.rec||[];let any=false;
  m.qs.forEach((q,i)=>{
    if(!revealed(m,i)||m.rec[i])return;
    const ok=m.A[m.me][i]===q.a,at=new Date().toISOString();
    saveRecord({id:"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),round:"m"+m.id,subject:m.subject,key:subjectKey(m.subject),
      level:m.level,line:seenLine(q),correct:ok,pts:ok?LEVELS[m.level].pts:0,at,qid:null});
    m.rec[i]=true;any=true;
  });
  if(any)rebuild();
}
function createMatch(subject,level,qs){
  const id=Math.random().toString(36).slice(2,10);
  matches[id]={id,subject,level,me:0,at:new Date().toISOString(),
    qs:qs.map(q=>({q:q.q,c:q.c,a:q.a,x:q.x||"",sym:q.sym||"",cat:q.cat||"",...(q.au?{au:q.au}:{})})),
    A:[qs.map(()=>null),qs.map(()=>null)],rec:[]};
  saveMatches();openMatch(id);
}
function openMatch(id){curMatch=id;matchShow=null;matchMsg="";view="match";render();window.scrollTo(0,0)}

/* ----- link packing ----- */
function b64u(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(t){const s=atob(t.replace(/-/g,"+").replace(/_/g,"/"));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function packMatch(m){
  const d={v:1,id:m.id,s:m.subject,l:m.level,f:m.me,
    q:m.qs.map(q=>[q.q,...q.c,q.a,q.x,q.sym,q.cat,...(q.au?[q.au]:[])]),
    A:m.A.map(a=>a.map(x=>x==null?"-":String(x)).join(""))};
  const raw=new TextEncoder().encode(JSON.stringify(d));
  if(window.CompressionStream){
    try{const z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());return "z"+b64u(z)}catch(e){}
  }
  return "j"+b64u(raw);
}
async function unpackMatch(t){
  let bytes=unb64u(t.slice(1));
  if(t[0]==="z")bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  const d=JSON.parse(new TextDecoder().decode(bytes));
  if(!d||d.v!==1||!d.id||!Array.isArray(d.q)||!LEVELS[d.l])throw new Error("bad link");
  const qs=d.q.map(r=>({q:String(r[0]),c:r.slice(1,5).map(String),a:Number(r[5]),x:String(r[6]||""),sym:String(r[7]||""),cat:String(r[8]||""),...(r[9]&&CLIP_BY_ID[r[9]]?{au:String(r[9])}:{})}));
  if(!qs.every(valid))throw new Error("bad question");
  const A=[0,1].map(p=>qs.map((_,i)=>{const ch=(d.A[p]||"")[i];return ch>="0"&&ch<="3"?+ch:null}));
  return {id:String(d.id).slice(0,16),subject:String(d.s).slice(0,80),level:d.l,from:d.f===1?1:0,qs,A};
}
async function openLink(hash){
  try{
    const d=await unpackMatch(fromName(decodeURIComponent(hash.slice(2))));
    let m=matches[d.id];
    if(!m){m=matches[d.id]={id:d.id,subject:d.subject,level:d.level,me:1-d.from,at:new Date().toISOString(),qs:d.qs,A:d.A,rec:[]}}
    else{for(const p of [0,1])d.A[p].forEach((x,i)=>{if(m.A[p][i]==null&&x!=null)m.A[p][i]=x})} // answers are never changed once given
    m.at=new Date().toISOString();
    recordRevealed(m);saveMatches();
    openMatch(d.id);
  }catch(e){
    log("bad challenge link "+(e&&e.message));
    view="setup";render("That challenge link didn't open. It may have been cut off when it was sent; ask for it to be sent again.");
  }
}
function matchText(m){
  const s=mScores(m), lv=LEVELS[m.level].name, n=m.qs.length;
  const fresh=m.A[1].every(x=>x==null)&&m.me===0;
  return complete(m)?`Final results are in for our ${m.subject} trivia match. Tap to see:`
    :fresh?`Flame Test Trivia challenge: ${m.subject} (${lv}, ${n} questions). Your turn:`
    :`Your turn in our ${m.subject} trivia match. Score so far: me ${s[m.me]}, you ${s[1-m.me]}.`;
}
let lastCopy="";
async function sendMatch(m){
  const msg=matchText(m)+" "+await matchLink(m);
  m.sentAt=new Date().toISOString();if(complete(m))m.sentFinal=true;saveMatches();
  lastCopy=msg;
  try{await navigator.clipboard.writeText(msg);matchMsg="Copied. Open Messages, paste it to your opponent, and send."}
  catch(e){matchMsg="copy-failed"}
  render();
  const box=$("copyBox");if(box){box.focus();box.select()}
}
function answerMatch(choice){
  const m=matches[curMatch],p=m.me,i=nextIdx(m,p);
  if(!canAnswer(m,p,i))return;
  m.A[p][i]=choice;m.at=new Date().toISOString();
  recordRevealed(m);saveMatches();matchShow=i;matchMsg="";render();
}
function matchBar(m){
  return m.qs.map((q,i)=>{const mine=m.A[m.me][i];
    return `<span class="${revealed(m,i)?(mine===q.a?"good":"bad"):mine!=null?"cur":""}"></span>`}).join("");
}
function renderMatch(st){
  const m=matches[curMatch],p=m.me,o=1-p,L="ABCD",lv=LEVELS[m.level],n=m.qs.length,s=mScores(m);
  const head=`<div class="label meta">${esc(m.subject)} · ${lv.name} · Challenge · you ${s[p]} · them ${s[o]}</div>`;
  const ni=nextIdx(m,p);
  const i=matchShow!=null?matchShow:(canAnswer(m,p,ni)?ni:-1);
  if(i>=0){
    const q=m.qs[i],mine=m.A[p][i],theirs=m.A[o][i],both=revealed(m,i),after=nextIdx(m,p);
    let reveal="";
    if(mine!=null){
      reveal=both?`<div class="reveal"><div class="verdict ${mine===q.a?"good":"bad"}">${mine===q.a?"Correct · +"+lv.pts+" pts":"Not quite · answer is "+L[q.a]}</div>
          <p class="duel">You: <b>${L[mine]}</b> ${mine===q.a?"✓":"✗"} · Them: <b>${L[theirs]}</b> ${theirs===q.a?"✓":"✗"}</p>${q.x?`<p>${esc(q.x)}</p>`:""}</div>`
        :`<div class="reveal"><div class="verdict">Answer locked in</div><p>You'll both see the result after your opponent answers.</p></div>`;
      reveal+=`<div style="margin-top:16px"><button type="button" class="btn primary" id="mNext">${canAnswer(m,p,after)?"Next question →":"Continue"}</button></div>`;
    }
    st.innerHTML=`<section class="panel">
      <div class="progress" aria-hidden="true">${matchBar(m)}</div>
      <article class="q">
        <div class="tile" aria-hidden="true"><span class="n"><span>${i+1}</span><span>${lv.pts}</span></span><span class="sym">${esc(q.sym||m.subject.slice(0,2))}</span><span class="nm">${esc(q.cat||m.subject)}</span></div>
        <div class="qbody">${head.replace("Challenge ·","Challenge · "+(i+1)+" of "+n+" ·")}
          ${theirs!=null&&mine==null?`<div class="label" style="color:var(--accent);margin-bottom:6px">Your opponent has answered this one</div>`:""}
          <p class="qtext">${esc(q.q)}</p>${audioHTML(q)}
          <div class="choices">${q.c.map((c,k)=>{let cls="choice";if(mine!=null){cls+=both?(k===q.a?" right":k===mine?" wrong":" dim"):(k===mine?" picked":" dim")}
            return `<button type="button" class="${cls}" data-k="${k}" ${mine!=null?"disabled":""}><span class="k">${L[k]}</span><span>${esc(c)}</span></button>`}).join("")}</div>
          ${reveal}
        </div>
      </article></section>`;
    st.querySelectorAll(".choice:not(:disabled)").forEach(b=>b.onclick=()=>answerMatch(+b.dataset.k));
    const nb=$("mNext");if(nb)nb.onclick=()=>{matchShow=null;render();window.scrollTo(0,0)};
    return;
  }
  // between turns, or finished
  const done=complete(m), owesFinal=done&&firstOf(n-1)!==p&&!m.sentFinal;
  const win=s[p]>s[o]?"You win":s[p]<s[o]?"They win":"It's a tie";
  st.innerHTML=`<section class="panel summary">
      <div class="progress" aria-hidden="true">${matchBar(m)}</div>
      ${head}
      ${done?`<div class="big" style="margin:10px 0 6px">${s[p]}–${s[o]}</div><p style="margin:0"><b>${win}.</b> +${s[p]*lv.pts} points to your total.</p>`
        :`<h2 style="margin:12px 0 6px">Their turn</h2><p style="margin:0 auto;max-width:46ch">Copy the message, paste it into a text to your opponent, and send it. When they've answered, they'll text a link back; open it to continue.</p>`}
      ${!done||owesFinal?`<div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn primary" id="mSend" type="button">${done?"Copy results for your opponent":m.sentAt?"Copy again":"Copy message for your opponent"}</button></div>`:""}
      ${matchMsg==="copy-failed"?`<p style="margin:12px 0 6px;font-size:14px">Couldn't copy automatically. Select all of this, copy it, and paste it into a text:</p>
        <textarea id="copyBox" readonly rows="4" style="width:100%;font:12px var(--mono);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)">${esc(lastCopy)}</textarea>`
        :matchMsg?`<p class="label" style="margin-top:12px">${esc(matchMsg)}</p>`:""}
      <div style="margin-top:14px"><button class="btn ${done&&!owesFinal?"primary":"quiet"}" id="mBack" type="button">New round</button></div>
    </section>`;
  const sb=$("mSend");if(sb)sb.onclick=()=>sendMatch(m);
  $("mBack").onclick=newRound;
}
function matchListHTML(){
  const list=Object.values(matches).sort((a,b)=>a.at<b.at?1:-1).slice(0,6);
  if(!list.length)return "";
  return `<div class="field mlist" style="margin:20px 0 0"><span class="label">Your challenges</span>
    ${list.map(m=>{const st=mStatus(m);return `<button type="button" class="mrow" data-match="${esc(m.id)}"><span class="s">${esc(m.subject)} · ${LEVELS[m.level].name}</span><span class="st ${st.key}">${esc(st.text)}</span></button>`}).join("")}</div>`;
}

/* ---------- reset all ---------- */
function resetButton(){
  const z=$("resetZone");
  z.innerHTML=`<button class="btn quiet" id="resetBtn" type="button">Erase all scores</button>`;
  $("resetBtn").onclick=()=>{
    z.innerHTML=`<div class="confirm"><span>Erase cumulative score and history?</span><button class="btn danger" id="yes" type="button">Erase</button><button class="btn" id="no" type="button">Cancel</button></div>`;
    $("yes").onclick=async()=>{
      resetAt=new Date().toISOString(); state.round=null; rebuild(); view="setup"; resetButton(); render(); saveRound();
      if(dbReady&&setDoc)setDoc.set({resetAt}).catch(()=>{});
    };
    $("no").onclick=resetButton;
  };
}

log("load "+navigator.userAgent.slice(0,80));
loadLocal();
log("local state round="+(state.round?state.round.questions.length:"none"));
if(!state.totals){state=blank()}
/* Always open on a clean setup screen: no subject pre-chosen and no old round resumed.
   Answers are saved one record at a time, so dropping the unfinished round loses no score. */
if(state.round){log("discarding saved round on startup");state.round=null;saveLocal()}
form={subject:"",level:"medium",count:10,audio:audioPref};
rebuild();
view="setup";
const fromLink=/^#c[zj]/.test(location.hash);
render();resetButton();const dbInit=initDb();
if(fromLink)openLink(location.hash);
window.addEventListener("hashchange",()=>{if(/^#c[zj]/.test(location.hash))openLink(location.hash)});
</script>
